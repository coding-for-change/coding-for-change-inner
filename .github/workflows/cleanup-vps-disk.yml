name: Cleanup VPS disk

# Manually-triggered (workflow_dispatch only) cleanup workflow.
# Frees Docker disk space by removing dangling images and stopped containers,
# then nudges the homepage stack to (re)start any services stuck in "Created".
#
# IMPORTANT: this workflow is deliberately CONSERVATIVE.
#   - docker image prune WITHOUT -a → removes only untagged/dangling images.
#     Anything still tagged (lebenshilfe:latest, mysql:8.0, portainer, etc.)
#     is preserved, even if its container is currently stopped.
#   - docker container prune → removes only stopped/created containers; running
#     containers from any compose project are untouched.
#   - Volumes are NEVER pruned. Postgres data is safe.
#
# Reuses the same VPS_DEPLOY_KEY secret as the deploy and debug workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Cleanup and restart homepage stack
        run: |
          set +e
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-homepage@codingforchange.com"
          section() { echo; echo "=== $1 ==="; }

          section "BEFORE: disk usage"
          $SSH "df -h /"

          section "BEFORE: docker space breakdown"
          $SSH "docker system df"

          section "Pruning stopped containers (only stopped/created — running ones untouched)"
          $SSH "docker container prune -f"

          section "Pruning dangling images (untagged only — NO -a, so tagged images preserved)"
          $SSH "docker image prune -f"

          section "AFTER: disk usage"
          $SSH "df -h /"

          section "AFTER: docker space breakdown"
          $SSH "docker system df"

          section "Bringing homepage stack back up (idempotent — only starts what's not running)"
          $SSH "cd /var/www/homepage && docker compose up -d"

          section "Final container state"
          $SSH "cd /var/www/homepage && docker compose ps -a"

          section "postgres logs after restart (tail 30)"
          sleep 10
          $SSH "cd /var/www/homepage && docker compose logs postgres --tail 30 --no-color"

          section "Confirm other projects on the host are still running"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}' | head -20"

          echo
          echo "=== done ==="
