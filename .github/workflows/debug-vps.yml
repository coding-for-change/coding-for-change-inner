name: Debug VPS

# Manually-triggered diagnostic workflow that SSHes to the VPS and prints
# container logs, disk usage, and env-var presence so we can debug the
# stack without needing direct SSH access. Reuses the same deploy key
# the regular deploy workflow uses. Secret values are redacted before
# being printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Gather VPS diagnostics
        run: |
          set +e   # don't abort the whole job if one command fails
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-homepage@codingforchange.com"

          section() { echo; echo "=== $1 ==="; }

          section "postgres container state"
          $SSH "cd /var/www/homepage && docker inspect homepage-postgres-1 --format 'status={{.State.Status}}  exit_code={{.State.ExitCode}}  oom_killed={{.State.OOMKilled}}  started_at={{.State.StartedAt}}  finished_at={{.State.FinishedAt}}  error=[{{.State.Error}}]'"

          section "postgres container logs (tail 150)"
          $SSH "cd /var/www/homepage && docker compose logs postgres --tail 150 --no-color"

          section "all containers in the homepage stack"
          $SSH "cd /var/www/homepage && docker compose ps -a"

          section "cms container logs (tail 80) — in case it reveals related context"
          $SSH "cd /var/www/homepage && docker compose logs cms --tail 80 --no-color"

          section "disk space"
          $SSH "df -h"

          section "memory"
          $SSH "free -h"

          section ".env keys present (values redacted)"
          $SSH "cd /var/www/homepage && sed 's/=.*/=<set>/' .env"

          section "postgres-data volume size"
          $SSH "docker run --rm -v homepage_postgres-data:/data alpine du -sh /data 2>/dev/null"

          section "docker version + compose version on VPS"
          $SSH "docker version --format '{{.Server.Version}}' && docker compose version"

          section "docker system df (high-level reclaimable space)"
          $SSH "docker system df"

          section "docker system df -v (per-image / per-volume detail, top 40 lines)"
          $SSH "docker system df -v 2>/dev/null | head -80"

          section "ALL containers on the host (incl. non-homepage projects)"
          $SSH "docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Size}}' | head -50"

          section "ALL images on the host, sorted by size (top 30)"
          $SSH "docker images -a --format '{{.Size}}\t{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}' | sort -h -r | head -30"

          section "Dangling images (untagged, safe to prune)"
          $SSH "docker images -f dangling=true --format '{{.ID}}\t{{.Size}}\t{{.CreatedSince}}' | head -30; echo; echo 'count:'; docker images -f dangling=true -q | wc -l"

          section "Stopped containers (safe to prune)"
          $SSH "docker ps -a --filter status=exited --filter status=created --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | head -30; echo; echo 'count:'; docker ps -a --filter status=exited --filter status=created -q | wc -l"

          section "Top-level /var/lib/docker subdirectory sizes"
          $SSH "sudo du -sh /var/lib/docker/* 2>/dev/null | sort -h -r | head -20 || du -sh /var/lib/docker/* 2>/dev/null | sort -h -r | head -20"

          section "Other big directories under /var (top 15)"
          $SSH "sudo du -sh /var/* 2>/dev/null | sort -h -r | head -15 || du -sh /var/* 2>/dev/null | sort -h -r | head -15"

          section "Other big directories under / (top 15)"
          $SSH "sudo du -sh /* 2>/dev/null | sort -h -r | head -15 || du -sh /* 2>/dev/null | sort -h -r | head -15"

          section "Largest individual files anywhere on disk (top 20, files >100MB)"
          $SSH "sudo find / -type f -size +100M 2>/dev/null | xargs -I{} sudo du -h {} 2>/dev/null | sort -h -r | head -20 || find / -type f -size +100M -exec du -h {} + 2>/dev/null | sort -h -r | head -20"

          section "Container log file sizes (default location, unrotated)"
          $SSH "sudo find /var/lib/docker/containers -name '*-json.log' -exec ls -lh {} + 2>/dev/null | sort -k5 -h -r | head -20 || find /var/lib/docker/containers -name '*-json.log' 2>/dev/null | head -20"

          section "Other compose projects on the host (so we know what NOT to touch)"
          $SSH "docker ps -a --format '{{.Label \"com.docker.compose.project\"}}' | sort -u"

          echo
          echo "=== done ==="
