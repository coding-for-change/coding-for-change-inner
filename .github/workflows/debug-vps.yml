name: Debug VPS

# Manually-triggered diagnostic workflow that SSHes to the VPS and prints
# container logs, disk usage, and env-var presence so we can debug the
# stack without needing direct SSH access. Reuses the same deploy key
# the regular deploy workflow uses. Secret values are redacted before
# being printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Gather VPS diagnostics
        run: |
          set +e   # don't abort the whole job if one command fails
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-homepage@codingforchange.com"

          section() { echo; echo "=== $1 ==="; }

          section "postgres container state"
          $SSH "cd /var/www/homepage && docker inspect homepage-postgres-1 --format 'status={{.State.Status}}  exit_code={{.State.ExitCode}}  oom_killed={{.State.OOMKilled}}  started_at={{.State.StartedAt}}  finished_at={{.State.FinishedAt}}  error=[{{.State.Error}}]'"

          section "postgres container logs (tail 150)"
          $SSH "cd /var/www/homepage && docker compose logs postgres --tail 150 --no-color"

          section "all containers in the homepage stack"
          $SSH "cd /var/www/homepage && docker compose ps -a"

          section "cms container logs (tail 80) — in case it reveals related context"
          $SSH "cd /var/www/homepage && docker compose logs cms --tail 80 --no-color"

          section "disk space"
          $SSH "df -h"

          section "memory"
          $SSH "free -h"

          section ".env keys present (values redacted)"
          $SSH "cd /var/www/homepage && sed 's/=.*/=<set>/' .env"

          section "postgres-data volume size"
          $SSH "docker run --rm -v homepage_postgres-data:/data alpine du -sh /data 2>/dev/null"

          section "docker version + compose version on VPS"
          $SSH "docker version --format '{{.Server.Version}}' && docker compose version"

          echo
          echo "=== done ==="
