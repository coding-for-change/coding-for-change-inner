<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Coding For Change — TUM Student Initiative for Social Tech (Munich, Verein)</title>
  <meta name="title" content="Coding For Change — TUM Student Initiative for Social Tech (Munich, Verein)">
  <meta name="description"
    content="Coding For Change is a TUM student initiative and Munich-based Verein. We build software for NGOs, host hackathons, and bring students together for social good. Join us in München.">

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://codingforchange.com/">
  <meta property="og:title" content="Coding For Change — TUM Student Initiative">
  <meta property="og:description" content="Munich's leading social computer science initiative. Software for NGOs. TUM students welcome.">
  <meta property="og:image" content="https://codingforchange.com/og-cover.png">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="de_DE">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Coding For Change — TUM Student Initiative">
  <meta name="twitter:description" content="Munich's leading social computer science initiative.">
  <meta name="twitter:image" content="https://codingforchange.com/og-cover.png">

  <!-- Structured data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["NGO", "EducationalOrganization"],
    "name": "Coding For Change",
    "alternateName": "Coding For Change e.V.",
    "url": "https://codingforchange.com",
    "logo": "https://codingforchange.com/images/c4c-branding/c4c_favicon.png",
    "description": "Munich-based student initiative and Verein building software for NGOs.",
    "foundingLocation": "Munich, Germany",
    "areaServed": "DE",
    "parentOrganization": {
      "@type": "CollegeOrUniversity",
      "name": "Technical University of Munich"
    },
    "sameAs": [
      "https://www.linkedin.com/company/coding-for-change/",
      "https://github.com/coding-for-change"
    ]
  }
  </script>

  <link rel="icon" href="../static/images/c4c-branding/c4c_favicon.png" type="image/png">

</head>
<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
